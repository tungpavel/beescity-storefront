  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0B0B0B;
      --surface:   #141414;
      --surface2:  #1E1E1E;
      --amber:     #C4622D;
      --orange:    #D4784A;
      --white:     #FFFFFF;
      --text:      #E8E8E8;
      --muted:     #888888;
      --border:    rgba(255,255,255,0.08);
      --green:     #22C55E;
      --radius-sm: 8px;
      --radius:    16px;
      --radius-lg: 28px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; line-height: 1.15; }
    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    #nav {
      background: rgba(11,11,11,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
    }
    .nav-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--white); }
    .nav-logo span { color: var(--amber); }
    .nav-links { display: flex; gap: 1.25rem; align-items: center; }
    .nav-links a { font-size: 0.82rem; color: var(--muted); transition: color 0.2s; }
    .nav-links a:hover { color: var(--white); }
    @media (max-width: 540px) { .nav-links { display: none; } }

    /* ── Hero ── */
    #hero { padding: 4.5rem 1.5rem 3rem; text-align: center; flex: 1; }
    .hero-eyebrow { display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); margin-bottom: 1rem; }
    .hero-title { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 900; color: var(--white); margin-bottom: 1rem; }
    .hero-title em { font-style: italic; color: var(--amber); }
    .hero-sub { font-size: 1rem; color: var(--muted); max-width: 480px; margin: 0 auto 3rem; line-height: 1.7; }

    /* ── Cards ── */
    .cards { display: flex; flex-direction: column; gap: 0.65rem; max-width: 420px; margin: 0 auto; padding: 0 0 4rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1.1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; transition: border-color 0.2s, transform 0.2s; }
    .card:hover { border-color: var(--amber); transform: translateY(-2px); }
    .card.featured { border-color: rgba(196,98,45,0.4); background: linear-gradient(135deg, rgba(196,98,45,0.06), var(--surface)); }
    .card-left { display: flex; align-items: center; gap: 0.6rem; }
    .card-icon { font-size: 1.1rem; flex-shrink: 0; }
    .card h3 { font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 600; color: var(--white); }
    .card-right { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .card-price { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
    .card-arrow { font-size: 0.82rem; color: var(--amber); font-weight: 600; }

    /* ── Footer ── */
    footer { padding: 1.5rem; border-top: 1px solid var(--border); text-align: center; }
    footer p { font-size: 0.78rem; color: var(--muted); }
    footer a { color: var(--amber); }
    .reveal { opacity: 0; transform: translateY(36px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }
  </style>
</head>
<body>

  <nav id="nav">
    <div class="nav-inner">
      <a href="/start/" class="nav-logo">Bees<span>City</span></a>
      <div class="nav-links">
        <a href="mailto:hello@beescity.co.uk">Contact</a>
        <a href="https://www.instagram.com/beescity.memories/" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </nav>

  <section id="hero">
    <span class="hero-eyebrow">✦ BeesCity</span>
    <h1 class="hero-title">What are you looking for<em>?</em></h1>
    <p class="hero-sub">Choose below to get started.</p>

    <div class="cards">

      <a href="/" class="card featured">
        <div class="card-left">
          <span class="card-icon">🖼️</span>
          <h3>Custom Photo Lithophane</h3>
        </div>
        <div class="card-right">
          <span class="card-price" id="price-custom">£29.00</span>
          <span class="card-arrow">→</span>
        </div>
      </a>

      <a href="/frame-only/" class="card">
        <div class="card-left">
          <span class="card-icon">💡</span>
          <h3>Lithophane Frame</h3>
        </div>
        <div class="card-right">
          <span class="card-price" id="price-frame">£25.00</span>
          <span class="card-arrow">→</span>
        </div>
      </a>

      <a href="/guides/lithophane-printing-guide/" class="card">
        <div class="card-left">
          <span class="card-icon">📖</span>
          <h3>Printing Guide</h3>
        </div>
        <div class="card-right">
          <span class="card-price" id="price-guide">£5.00</span>
          <span class="card-arrow">→</span>
        </div>
      </a>

      <a href="/blog/history-of-lithophanes/" class="card">
        <div class="card-left">
          <span class="card-icon">📜</span>
          <h3>History of Lithophanes</h3>
        </div>
        <div class="card-right">
          <span class="card-price">Free</span>
          <span class="card-arrow">→</span>
        </div>
      </a>

    </div>
  </section>

  <footer>
    <p>© 2026 BeesCity · <a href="mailto:hello@beescity.co.uk">hello@beescity.co.uk</a></p>
  </footer>

  <script>
    async function loadPrices() {
      try {
        const res = await fetch('/graphql', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: `{
            custom: product(handle: "3d-print") { variants(first:1) { nodes { price { amount currencyCode } } } }
            frame:  product(handle: "lithophane-frame") { variants(first:1) { nodes { price { amount currencyCode } } } }
            guide:  product(handle: "lithophane-master-guide") { variants(first:1) { nodes { price { amount currencyCode } } } }
          }` })
        });
        const data = await res.json();
        const fmt = (p) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: p.currencyCode }).format(p.amount);
        const c = data?.data?.custom?.variants?.nodes?.[0]?.price;
        const f = data?.data?.frame?.variants?.nodes?.[0]?.price;
        const g = data?.data?.guide?.variants?.nodes?.[0]?.price;
        if (c) document.getElementById('price-custom').textContent = fmt(c);
        if (f) document.getElementById('price-frame').textContent = fmt(f);
        if (g) document.getElementById('price-guide').textContent = fmt(g);
      } catch(e) {}
    }
    loadPrices();

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revealObserver.unobserve(e.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.card').forEach((el, i) => {
      el.classList.add('reveal');
      if (i % 4 > 0) el.classList.add(`reveal-delay-${i % 4}`);
      revealObserver.observe(el);
    });
  </script>
